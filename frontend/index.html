<!doctype html>
<html lang="vi">

<head>
  <meta charset="UTF-8" />
  <link rel="icon" type="image/svg+xml" href="/vite.svg" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>PhoBERT NER — Nhận dạng Thực thể Y tế Tiếng Việt</title>
  <meta name="description" content="Hệ thống AI trích xuất thực thể y tế tiếng Việt dựa trên mô hình PhoBERT fine-tuned trên bộ dữ liệu PhoNER COVID-19." />

  <!-- Google Fonts: Cormorant Garamond (serif display) + Inter (body sans) + JetBrains Mono (code) -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;1,400&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">

  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          fontFamily: {
            display: ['"Cormorant Garamond"', 'Tiempos Headline', 'Garamond', '"Times New Roman"', 'serif'],
            sans: ['Inter', '-apple-system', 'BlinkMacSystemFont', '"Segoe UI"', 'Roboto', 'sans-serif'],
            mono: ['"JetBrains Mono"', 'ui-monospace', 'monospace'],
          },
          colors: {
            // Brand & Accent
            coral: {
              DEFAULT: '#cc785c',
              active: '#a9583e',
              disabled: '#e6dfd8',
            },
            // Canvas & Surfaces
            canvas: '#faf9f5',
            surface: {
              soft: '#f5f0e8',
              card: '#efe9de',
              strong: '#e8e0d2',
              dark: '#181715',
              'dark-elevated': '#252320',
              'dark-soft': '#1f1e1b',
            },
            // Text
            ink: '#141413',
            body: {
              DEFAULT: '#3d3d3a',
              strong: '#252523',
            },
            muted: {
              DEFAULT: '#6c6a64',
              soft: '#8e8b82',
            },
            hairline: {
              DEFAULT: '#e6dfd8',
              soft: '#ebe6df',
            },
            // On-color
            'on-dark': '#faf9f5',
            'on-dark-soft': '#a09d96',
            // Accent
            teal: '#5db8a6',
            amber: '#e8a55a',
          },
          borderRadius: {
            'xs': '4px',
            'sm': '6px',
            'md': '8px',
            'lg': '12px',
            'xl': '16px',
          },
          letterSpacing: {
            'display-xl': '-0.094rem',
            'display-lg': '-0.0625rem',
            'display-md': '-0.031rem',
            'display-sm': '-0.019rem',
          },
        }
      }
    }
  </script>
</head>

<body class="bg-canvas text-body min-h-screen selection:bg-coral selection:text-white">
  <div id="root"></div>
  <script type="module" src="/src/main.jsx"></script>
</body>

</html>
